<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI year · Delivery Analytics</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav id="nav">
    <h1>Delivery Analytics</h1>
    <a href="/">Dashboard</a>
    <a href="/person">People</a>
    <a href="/uplift">AI uplift</a>
    <a href="/ai-year">AI year</a>
    <a href="/rankings">Rankings</a>
    <a href="/qa">QA</a>
    <a href="/ask">Ask</a>
    <h2 class="nav-group">Set up</h2>
    <a href="/selection">Selection</a>
    <a href="/teams">Teams</a>
    <a href="/sources">Sources</a>
    <a href="/settings">Settings</a>
  </nav>
  <div class="page">
    <header id="header"></header>
    <main id="content">
      <h2>AI year</h2>
      <p class="note">Each direct report's last twelve months, split at their first Claude use, against the expectations at their level.</p>
      <p class="pickers">
        <label>Person <select id="year-person" aria-label="Person"></select></label>
        <label>Compare against <select id="uplift-compare" aria-label="Compare against"></select></label>
      </p>
      <div id="uplift-people" class="card" hidden></div>
      <p id="uplift-compare-note" class="note"></p>
      <h3 id="person-name"></h3>
      <p id="person-summary" class="note"></p>
      <ul id="person-notes" class="notes"></ul>
      <p id="person-coverage" class="note"></p>
      <p id="uplift-legend" class="note"></p>
      <div id="person-body"></div>
    </main>
  </div>
  <script src="/static/vendor/chart.umd.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/uplift-charts.js"></script>
  <script src="/static/pages/ai-year.js"></script>
</body>
</html>

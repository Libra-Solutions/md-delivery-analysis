<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Person · Delivery Analytics</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav id="nav">
    <h1>Delivery Analytics</h1>
    <a href="/">Dashboard</a>
    <a href="/person">People</a>
    <a href="/rankings">Rankings</a>
    <a href="/qa">QA</a>
    <a href="/ask">Ask</a>
    <h2 class="nav-group">Set up</h2>
    <a href="/selection">Selection</a>
    <a href="/teams">Teams</a>
    <a href="/sources">Sources</a>
    <a href="/settings">Settings</a>
  </nav>
  <div class="page">
    <header id="header"></header>
    <main id="content">
      <div class="form-row person-switch">
        <label for="person-picker">Person</label>
        <select id="person-picker"><option value="">Choose a person…</option></select>
        <a id="all-people" href="/people">All people</a>
      </div>
      <h2 id="person-name">Person</h2>
      <p id="person-identities" class="note"></p>
      <div id="person-charts"></div>
      <details class="raw-details">
        <summary>Show the tickets and PRs</summary>
        <h3 class="section-head">The work behind the numbers</h3>
        <div id="person-stats" class="stats"></div>
        <div class="cards">
          <section class="card"><h3>Commits by week</h3><div id="person-commits"></div></section>
          <section class="card"><h3>Reviews waiting on them</h3><div id="person-pending"></div></section>
        </div>
        <section class="card hidden" id="person-issues-card"><h3>Completed issues</h3><div id="person-issues"></div></section>
        <section class="card"><h3>Tickets and Claude cost</h3><div id="person-tickets"></div></section>
        <section class="card"><h3>Pull requests</h3><div id="person-prs"></div></section>
        <section class="card"><h3>Reviews given</h3><div id="person-reviews"></div></section>
      </details>
    </main>
  </div>
  <script src="/static/vendor/chart.umd.js"></script>
  <script src="/static/app.js"></script>
  <script src="/static/charts.js"></script>
  <script src="/static/person-charts.js"></script>
  <script src="/static/pages/person.js"></script>
</body>
</html>
